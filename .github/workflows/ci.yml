name: Governed AI Database Copilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint-test:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/agent-service/requirements.txt
          pip install -r apps/mcp-db-server/requirements.txt
          pip install -r evals/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Test Suite
        run: |
          python -m pytest

      - name: Run Evaluation Benchmark Harness
        run: |
          python evals/eval_runner.py

  frontend-build-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Next.js Dependencies
        run: |
          cd apps/web
          npm install

      - name: Next.js Typecheck & Build
        run: |
          cd apps/web
          npm run build
